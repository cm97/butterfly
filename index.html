<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butterfly — Money Printer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: radial-gradient(ellipse at center, #1a0a00 0%, #000 70%);
      color: #ffd700;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 5rem);
      text-shadow: 0 0 20px #ffd700, 0 0 60px #ff6600;
      letter-spacing: 0.3em;
      margin-bottom: 0.5rem;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 20px #ffd700, 0 0 60px #ff6600; }
      to { text-shadow: 0 0 40px #ffd700, 0 0 100px #ff6600, 0 0 140px #ff0000; }
    }
    .subtitle {
      color: #ff6600;
      font-size: 1.1rem;
      letter-spacing: 0.5em;
      margin-bottom: 2rem;
      opacity: 0.8;
    }
    .candle-area {
      position: relative;
      width: 120px;
      height: 220px;
      margin-bottom: 2rem;
    }
    .candle {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 180px;
      background: linear-gradient(to top, #f5e6c8, #fff8e7);
      border-radius: 8px 8px 4px 4px;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.5);
    }
    .candle::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 16px;
      background: #333;
      border-radius: 2px;
    }
    .flame {
      position: absolute;
      top: -42px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 34px;
      background: radial-gradient(ellipse at bottom, #fff 0%, #ffd700 30%, #ff6600 60%, transparent 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      animation: flicker 0.15s infinite alternate;
      box-shadow: 0 0 30px #ff6600, 0 0 60px #ff0000;
    }
    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 1; }
      50% { transform: translateX(-50%) scale(1.1) rotate(2deg); opacity: 0.9; }
      100% { transform: translateX(-50%) scale(0.95) rotate(-1deg); opacity: 1; }
    }
    .counter-wrap {
      text-align: center;
      margin-bottom: 2rem;
    }
    .counter-label {
      font-size: 0.9rem;
      color: #ff6600;
      letter-spacing: 0.4em;
      margin-bottom: 0.5rem;
    }
    #counter {
      font-size: clamp(2.5rem, 10vw, 6rem);
      font-weight: bold;
      color: #00ff88;
      text-shadow: 0 0 30px #00ff88;
      transition: transform 0.1s;
    }
    .btn {
      background: linear-gradient(135deg, #ff6600, #ff0000);
      color: #fff;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-family: inherit;
      letter-spacing: 0.3em;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(255, 102, 0, 0.6);
      transition: all 0.2s;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(255, 102, 0, 0.9);
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .bills {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bill {
      position: absolute;
      bottom: -60px;
      width: 60px;
      height: 26px;
      background: linear-gradient(135deg, #1a5c2e, #2d8a4e);
      border: 2px solid #ffd700;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #ffd700;
      font-weight: bold;
      animation: fly 3s linear forwards;
      opacity: 0.85;
    }
    @keyframes fly {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.85; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
    .wax-pool {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 12px;
      background: #f5e6c8;
      border-radius: 50%;
      opacity: 0.6;
    }
    .status {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #666;
      letter-spacing: 0.2em;
    }
    .status.printing { color: #00ff88; }
  </style>
</head>
<body>
  <div class="bills" id="bills"></div>

  <h1>BUTTERFLY</h1>
  <div class="subtitle">MONEY PRINTER</div>

  <div class="candle-area">
    <div class="candle">
      <div class="flame" id="flame"></div>
    </div>
    <div class="wax-pool"></div>
  </div>

  <div class="counter-wrap">
    <div class="counter-label">TOTAL PRINTED</div>
    <div id="counter">$0</div>
  </div>

  <button class="btn" id="printBtn" onclick="startPrinting()">🔥 LIGHT THE CANDLE</button>
  <div class="status" id="status">Candle unlit. Nothing happens without the candle.</div>

  <script>
    let printing = false;
    let total = 0;
    let interval = null;

    function startPrinting() {
      if (printing) return;
      printing = true;
      document.getElementById('printBtn').disabled = true;
      document.getElementById('printBtn').textContent = '🖨️ PRINTING...';
      document.getElementById('status').textContent = 'CANDLE LIT. THE BUTTERFLY IS FEEDING.';
      document.getElementById('status').classList.add('printing);
      document.getElementById('flame').style.display = 'block';

      interval = setInterval(() => {
        const amount = Math.floor(Math.random() * 50000) + 10000;
        total += amount;
        const counter = document.getElementById('counter);
        counter.textContent = '$' + total.toLocaleString('en-US');
        counter.style.transform = 'scale(1.15)';
        setTimeout(() => { counter.style.transform = 'scale(1)'; }, 100);

        // Spawn bills
        for (let i = 0; i < 3; i++) {
          const bill = document.createElement('div);
          bill.className = 'bill';
          bill.textContent = '$' + amount.toLocaleString('en-US').slice(0, 4);
          bill.style.left = Math.random() * 100 + '%';
          bill.style.animationDuration = (2 + Math.random() * 2) + 's';
          document.getElementById('bills').appendChild(bill);
          setTimeout(() => bill.remove(), 4000);
        }
      }, 300);
    }

    // Keyboard shortcut: press C to light the candle
    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'c' && !printing) startPrinting();
    });
  </script>
</body>
</html>
